<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DPSA Jobs Admin</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <h1>DPSA Jobs Admin</h1>
      <p class="muted">Connect to the Cloudflare Pages preview before saving vacancies. Your admin key stays in this browser session.</p>
      <form id="auth-form">
        <label for="api-origin">Cloudflare site address</label>
        <input id="api-origin" type="url" autocomplete="url" value="https://www.dpsagovernmentjobs.co.za" required>
        <label for="admin-secret">Admin access key</label>
        <div class="auth-row">
          <input id="admin-secret" type="password" autocomplete="current-password" required>
          <button type="submit">Connect</button>
        </div>
      </form>
      <nav id="tabs" aria-label="Admin sections">
        <button data-tab="import" class="selected" type="button">Import</button>
        <button data-tab="jobs" type="button">Vacancies</button>
        <button data-tab="comments" type="button">Comments</button>
        <button data-tab="subscribers" type="button">Subscribers</button>
      </nav>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="panel-import" class="panel selected">
        <h2>Parse DPSA circulars</h2>
        <p>PDF text is extracted in this browser. Review each vacancy before saving it.</p>
        <label class="file-picker">Choose circular PDFs<input id="circular-files" type="file" accept="application/pdf,.pdf" multiple></label>
        <button id="parse-button" type="button">Parse selected PDFs</button>
        <div id="import-rows"></div>
        <button id="save-import-button" type="button" disabled>Save selected vacancies</button>
      </section>
      <section id="panel-jobs" class="panel">
        <div class="section-heading"><h2>Vacancies</h2><button id="refresh-jobs" type="button">Refresh</button></div>
        <input id="job-filter" type="search" placeholder="Filter by title or department">
        <div id="job-list"></div>
      </section>
      <section id="panel-comments" class="panel">
        <div class="section-heading"><h2>Comments for review</h2><button id="refresh-comments" type="button">Refresh</button></div>
        <div id="comment-list"></div>
      </section>
      <section id="panel-subscribers" class="panel">
        <div class="section-heading"><h2>Job alert subscribers</h2><button id="refresh-subscribers" type="button">Refresh</button></div>
        <div id="subscriber-list"></div>
      </section>
      <dialog id="job-editor">
        <form id="job-edit-form">
          <h2>Edit vacancy</h2>
          <input name="slug" type="hidden">
          <label>Title<input name="title" maxlength="250" required></label>
          <label>Department<input name="department" maxlength="180"></label>
          <label>Location<input name="location" maxlength="180"></label>
          <label>Closing date<input name="closing_date" type="date"></label>
          <label>Application link<input name="application_url" type="url"></label>
          <label>Status<select name="status"><option value="draft">Draft</option><option value="published">Published</option><option value="closed">Closed</option></select></label>
          <label>Description<textarea name="description" rows="8" required></textarea></label>
          <div class="editor-actions"><button value="cancel" formmethod="dialog">Cancel</button><button type="submit">Save changes</button></div>
        </form>
      </dialog>
    </main>
    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
